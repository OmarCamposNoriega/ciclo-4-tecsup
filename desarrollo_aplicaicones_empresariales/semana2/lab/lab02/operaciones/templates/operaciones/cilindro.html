<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 40px;
            color: #000;
        }
        .main-wrapper {
            max-width: 600px;
            margin: 0 auto;
        }
        /* Recuadro principal exactamente como en la guía */
        .calculator-box {
            border: 2px solid #222;
            padding: 30px 40px;
            margin-bottom: 25px;
            background: #fff;
        }
        h2.title {
            text-align: center;
            font-family: 'Times New Roman', serif;
            font-size: 22px;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 35px;
            color: #002b49;
            font-weight: bold;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .form-row label {
            flex: 1;
        }
        .form-row input[type="text"] {
            width: 180px;
            padding: 6px 10px;
            border: 1px solid #7a92a5;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-calc {
            background-color: #e1e1e1;
            border: 1px solid #767676;
            padding: 6px 20px;
            font-size: 15px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-calc:hover {
            background-color: #d0d0d0;
        }
        /* Sección de resultado idéntica a la guía */
        .resultado-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: normal;
        }
        .resultado-box {
            border: 2px solid #222;
            padding: 15px 25px;
            font-size: 16px;
            background: #fff;
        }
        .error-box {
            background-color: #fde8e8;
            border: 1px solid #f98080;
            color: #9b1c1c;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .nav-links {
            margin-top: 30px;
            text-align: center;
        }
        .nav-links a {
            color: #0066cc;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        
        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <!-- Recuadro del Formulario -->
        <div class="calculator-box">
            <h2 class="title">CÁLCULO DEL VOLUMEN DE UN CILINDRO</h2>
            
            <form action="{% url 'operaciones:cilindro' %}" method="post">
                {% csrf_token %}
                
                <div class="form-row">
                    <label for="diametro">Introduzca el diámetro en metros:</label>
                    <input type="text" id="diametro" name="diametro" value="{{ diametro|default:'2.15' }}" required>
                </div>

                <div class="form-row">
                    <label for="altura">Introduzca la altura en metros:</label>
                    <input type="text" id="altura" name="altura" value="{{ altura|default:'1.75' }}" required>
                </div>

                <div>
                    <button type="submit" class="btn-calc">Calcular</button>
                </div>
            </form>
        </div>

        <!-- Recuadro de Resultado (si se calculó) -->
        {% if resultado %}
        <div>
            <div class="resultado-title">Resultado:</div>
            <div class="resultado-box">
                {{ resultado }}
            </div>
        </div>
        {% endif %}

        <div class="nav-links">
            <a href="{% url 'operaciones:index' %}">← Menú Actividad 3</a>
            |
            <a href="{% url 'encuesta:index' %}">Ir a Encuesta (Actividad 2)</a>
        </div>
    </div>
</body>
</html>
