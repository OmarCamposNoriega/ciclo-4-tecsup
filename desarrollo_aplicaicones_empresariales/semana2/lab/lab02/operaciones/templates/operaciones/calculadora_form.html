<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 40px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1f2937;
            margin-top: 0;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Operaciones Matemáticas</h2>
        <form action="{% url 'operaciones:calculadora_resultado' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="numero1">Primer número:</label>
                <input type="number" step="any" id="numero1" name="numero1" value="18" required>
            </div>

            <div class="form-group">
                <label for="numero2">Segundo número:</label>
                <input type="number" step="any" id="numero2" name="numero2" value="19" required>
            </div>

            <div class="form-group">
                <label for="operacion">Seleccione la operación:</label>
                <select id="operacion" name="operacion" required>
                    <option value="suma">Suma (+)</option>
                    <option value="resta">Resta (-)</option>
                    <option value="multiplicacion">Multiplicación (*)</option>
                </select>
            </div>

            <button type="submit" class="btn">Calcular Resultado</button>
        </form>

        <a class="back-link" href="{% url 'operaciones:index' %}">← Volver al menú de actividades</a>
    </div>
</body>
</html>
