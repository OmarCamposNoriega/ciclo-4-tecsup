<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 40px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1f2937;
            margin-top: 0;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .resultado-box {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 20px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 15px;
            text-align: center;
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #6b7280;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ titulo }}</h2>
        
        <p>Resultado de la operación solicitada:</p>
        <div class="resultado-box">
            {{ mensaje }}
        </div>

        <div style="text-align: center; margin-top: 25px;">
            <a class="btn" href="{% url 'operaciones:calculadora_form' %}">Realizar otra operación</a>
            <a class="btn btn-secondary" href="{% url 'operaciones:index' %}">Menú principal</a>
        </div>
    </div>
</body>
</html>
